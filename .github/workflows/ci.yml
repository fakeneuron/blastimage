name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin matches the `DC` pin in the justfile `coverage` recipe. Bump both
  # together. uvx rather than a dependency, because this repo has no Python
  # stack for diff-cover to live in.
  DIFF_COVER_VERSION: "10.5.1"
  COVERAGE_MIN: "80"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # fetch-depth 0 so the changed-line gate can resolve github.event.before
      # on a push. A shallow clone makes that base unresolvable and the gate
      # skips. The secrets and e2e jobs do not run the gate.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage

      - name: Resolve coverage diff base
        id: covbase
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$PR_BASE"
          elif [ -n "${PUSH_BEFORE:-}" ] \
            && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ]; then
            echo "::notice::No usable diff base — changed-line coverage gate skipped for this run."
          else
            echo "Coverage diff base: $base"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: Coverage (changed lines)
        if: steps.covbase.outputs.ref != ''
        env:
          BASE: ${{ steps.covbase.outputs.ref }}
        run: |
          set -euo pipefail
          # Root layout: lcov SF: paths are already repo-root-relative.
          uvx "diff-cover@${DIFF_COVER_VERSION}" coverage/lcov.info \
            --compare-branch="$BASE" --fail-under="$COVERAGE_MIN" --show-uncovered

      - name: Build
        run: npm run build

      # Runtime dependencies only — dev-tooling advisories never reach a built
      # artifact, so the dev tree stays deliberately ungated (BI-034.3).
      # Next 15 could only pass this gate with a postcss/sharp `overrides`
      # block in package.json; Next 16 pins both safely on its own, so
      # DEPLOY-002 deleted it. This gate now runs against the unmodified
      # resolved tree — a failure here is a genuinely new advisory, not a
      # local pin that fell behind.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  # Working-tree secret scan (DEPLOY-001). Separate job so it never sees
  # Build-produced `.next/` — `gitleaks dir .` ignores `.gitignore` and Next's
  # own previewMode/encryption keys false-positive as generic-api-key (BI-034.5).
  # Pre-commit hook stops secrets before history; this is the backstop for
  # clones that never ran `pre-commit install`. Pin deliberately — unpinned
  # scanner versions change findings between runs (natabula spine / marscharts).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Gitleaks (working-tree secret scan)
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact

  # Playwright e2e (TEST-007.2). Sibling job so Chromium install + Next
  # boot don't inflate the unit `ci` job. Owns port 3009
  # (`reuseExistingServer: false`); `just dev` on 3003 is unrelated.
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        run: npm run e2e
