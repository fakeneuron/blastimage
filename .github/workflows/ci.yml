name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Runtime dependencies only — dev-tooling advisories never reach a built
      # artifact. The Next 15 tree's postcss/sharp advisories are held clear by
      # the `overrides` block in package.json (BI-034.3). Drop those overrides
      # when the tree moves to Next 16, which fixes them upstream — Dependabot
      # surfaces that major as its own PR (BI-034.4).
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
