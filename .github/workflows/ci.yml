name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin matches the `DC` pin in the justfile `coverage` recipe. Bump both
  # together. uvx rather than a dependency, because this repo has no Python
  # stack for diff-cover to live in.
  DIFF_COVER_VERSION: "10.5.1"
  COVERAGE_MIN: "80"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # `actions: read` lets the coverage-base step find the last green run
    # (natabula NAT-600, BI-084). A job-level block sets every unlisted scope
    # to none, so `contents: read` is listed for checkout.
    permissions:
      contents: read
      actions: read

    steps:
      # fetch-depth 0 so the changed-line gate can resolve its push base (the
      # last green run's SHA, or github.event.before) and check its ancestry.
      # A shallow clone makes that base unresolvable and the gate skips. The
      # secrets and e2e jobs do not run the gate.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --coverage

      - name: Resolve coverage diff base
        id: covbase
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # Both triggers are handled on purpose. A PR-only coverage gate is the
          # textbook deployment, but this fleet commits directly to `main`
          # (~/Code/CLAUDE.md), so PR-only would ship a gate that never runs —
          # the same "installed and never invoked" defect this gate was added
          # to remove. Values come in as env vars, never interpolated into the
          # script body, so a branch name cannot inject shell.
          #
          # On a push the base is the head of the last GREEN push run of this
          # workflow on this branch (NAT-600), not `github.event.before`. A
          # push whose run failed or was cancelled (cancel-in-progress) before
          # this step never had its lines gated; diffing from the previous head
          # would skip them for good. Needs the job's `actions: read`. The
          # green SHA must still be an ancestor of HEAD (a force-push can
          # orphan it). Any lookup failure, or no green run yet, falls back to
          # `github.event.before` — the lookup can widen the gate, never break it.
          # A red gate therefore stays red until those lines are covered:
          # pushing again no longer moves the base past them. Any other event
          # (workflow_dispatch, schedule) has no pushed lines and skips.
          #
          # Hardening (NAT-615): a failed lookup warns rather than falling back
          # silently (a missing `actions: read` would otherwise quietly undo
          # NAT-600). Runs list newest-created first, not in commit order
          # (re-runs, concurrent pushes), so of the recent green SHAs the one
          # nearest HEAD among its ancestors wins. A green base more than
          # `max_behind` commits back means some job has been red that long;
          # warn and fall back rather than widen the diff without bound. A tag
          # push has no branch history to look up and skips.
          max_behind=50
          base=""
          why=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$PR_BASE"
            why="PR base"
          elif [ "$EVENT_NAME" = "push" ] && [ "${REF_TYPE:-}" = "tag" ]; then
            echo "::notice::Tag push — no branch history to diff against."
          elif [ "$EVENT_NAME" = "push" ]; then
            # `owner/repo/.github/workflows/ci.yml@refs/heads/main` -> `ci.yml`;
            # strip only the `@refs/…` suffix: the path and the branch may each hold an `@`.
            wf="${WORKFLOW_REF%@refs/*}"
            wf="${wf##*/}"
            err="$(mktemp)"
            if ! greens="$(gh run list --workflow "$wf" --branch "$BRANCH" --event push --status success \
              --limit 20 --json headSha --jq '.[].headSha' 2>"$err")"; then
              echo "::warning::Last-green run lookup failed ($(head -n 1 "$err")); falling back to the previous head. Does the job grant \`actions: read\`?"
              greens=""
            fi
            rm -f "$err"
            green=""
            behind=""
            while read -r sha; do
              [ -n "$sha" ] || continue
              git cat-file -e "${sha}^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "$sha" HEAD 2>/dev/null || continue
              n="$(git rev-list --count "${sha}..HEAD")"
              if [ -z "$behind" ] || [ "$n" -lt "$behind" ]; then
                green="$sha"
                behind="$n"
              fi
            done <<< "$greens"
            if [ -n "$green" ] && [ "$behind" -gt "$max_behind" ]; then
              echo "::warning::Last green run ($green) is $behind commits behind HEAD (cap $max_behind) — a job has been red that long; falling back to the previous head."
              green=""
            fi
            if [ -n "$green" ]; then
              base="$green"
              why="last green run"
            elif [ -n "${PUSH_BEFORE:-}" ] \
              && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] \
              && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              base="$PUSH_BEFORE"
              why="previous head; no usable green run"
            fi
          fi
          if [ -z "$base" ]; then
            # First push to a new branch, a force-push, or a squashed history:
            # there is no honest base to diff against. Skip loudly rather than
            # comparing against something wrong.
            echo "::notice::No usable diff base — changed-line coverage gate skipped for this run."
          else
            echo "Coverage diff base: $base ($why)"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: Coverage (changed lines)
        if: steps.covbase.outputs.ref != ''
        env:
          BASE: ${{ steps.covbase.outputs.ref }}
        run: |
          set -euo pipefail
          # Root layout: lcov SF: paths are already repo-root-relative.
          uvx "diff-cover@${DIFF_COVER_VERSION}" coverage/lcov.info \
            --compare-branch="$BASE" --fail-under="$COVERAGE_MIN" --show-uncovered

      - name: Build
        run: npm run build

      # Runtime dependencies only — dev-tooling advisories never reach a built
      # artifact, so the dev tree stays deliberately ungated (BI-034.3).
      # Next 15 could only pass this gate with a postcss/sharp `overrides`
      # block in package.json; Next 16 pins both safely on its own, so
      # DEPLOY-002 deleted it. This gate now runs against the unmodified
      # resolved tree — a failure here is a genuinely new advisory, not a
      # local pin that fell behind.
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  # Working-tree secret scan (DEPLOY-001). Separate job so it never sees
  # Build-produced `.next/` — `gitleaks dir .` ignores `.gitignore` and Next's
  # own previewMode/encryption keys false-positive as generic-api-key (BI-034.5).
  # Pre-commit hook stops secrets before history; this is the backstop for
  # clones that never ran `pre-commit install`. Pin deliberately — unpinned
  # scanner versions change findings between runs (natabula spine / marscharts).
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Gitleaks (working-tree secret scan)
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact

  # Landing page (DEPLOY-013). A separate Astro stack the root gates skip, and it
  # reads `../brand/BRAND.md` + `brand/assets.json` at build time — so a broken
  # brand frontmatter field or a moved brand asset would otherwise surface only
  # at `wrangler` publish time. Full checkout, not sparse: the build imports
  # from `brand/`.
  landing:
    name: Landing (astro check + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: landing

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # Same runtime-only gate as the root `ci` job (DEPLOY-014.3).
      - name: Audit
        run: npm audit --omit=dev --audit-level=high

  # Playwright e2e (TEST-007.2). Sibling job so browser install + Next
  # boot don't inflate the unit `ci` job. Owns port 3009
  # (`reuseExistingServer: false`); `just dev` on 3003 is unrelated.
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # WebKit stands in for Safari, the operator's daily driver (TEST-012.2).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Run e2e
        run: npm run test:e2e

      # The html reporter (TEST-010) writes playwright-report/ on every run;
      # keep it only when the run fails, so a red CI leaves something to open.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
